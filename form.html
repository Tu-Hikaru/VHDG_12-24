<h1>Các bạn nghĩ sao về văn hoá dân gian lớp mình</h1>
<div class="container">
    

    <form action="respond.html" method="GET">
        <label for="name">Họ và tên:</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br>

        <label>Bạn có thích lễ hội văn hoá dân gian ở Phan Châu Trinh không?</label><br>
        <input type="radio" id="yes" name="likeFestival" value="Có">
        <label for="yes">Có</label>

        <input type="radio" id="no" name="likeFestival" value="Không">
        <label for="no">Không</label><br>

        <label>Bạn thích điều gì ở Văn hoá dân gian PCT?</label><br>
        <input type="checkbox" id="food" name="favorite[]" value="Đồ ăn ngon">
        <label for="food">Đồ ăn ngon</label><br>

        <input type="checkbox" id="atmosphere" name="favorite[]" value="Không khí náo nhiệt">
        <label for="atmosphere">Không khí náo nhiệt</label><br>

        <input type="checkbox" id="games" name="favorite[]" value="Nhiều trò chơi hấp dẫn">
        <label for="games">Nhiều trò chơi hấp dẫn</label><br>

        <input type="checkbox" id="performance" name="favorite[]" value="Văn nghệ và thời trang">
        <label for="performance">Các màn biểu diễn văn nghệ và thời trang siêu hay</label>
       
        <p>Hãy chia sẻ cảm nghĩ của bạn về gian hàng 12/24 nhé:</p>
     
        <textarea id="feedback" name="feedback" placeholder="Nhập cảm nghĩ của bạn tại đây..."></textarea>
        <div class="submit">
            <button type="submit">Send</button>
        </div>
    </form>
</div>

</body>

</html>
